# filepath: .github/workflows/ubuntu24.04.yml
name: ubuntu24.04

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libopencv-dev libeigen3-dev zlib1g-dev libspdlog-dev cmake libgtest-dev
      - name: Build
        run: |
          mkdir build && cd build
          cmake -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
      - name: Test
        run: |
          cd build
          ctest --verbose
